name: Host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Playwright CLI and Chromium
        run: |
          npm install --global @playwright/cli@0.1.22
          playwright-cli install-browser chromium --with-deps
      - name: Generate self-contained portal page
        run: python3 payload/gen_html.py
      - name: Run portable host suite
        run: make -C tests clean test
      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer suite
        run: make -C tests sanitize
      - name: Run remap browser regression
        run: bash scripts/run_webui_browser.sh
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SteamController-PS5-browser-evidence
          path: |
            output/playwright/
            .playwright-cli/
          if-no-files-found: warn
