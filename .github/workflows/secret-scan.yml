name: Secret scan (full Git history)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan history and report only finding metadata (no secret values)
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --no-banner --redact=100 --exit-code=0 --log-opts="--all" \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-report.json" .
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "gitleaks-report.json"
          findings = json.loads(path.read_text()) if path.is_file() else []
          print(f"Potential secret findings: {len(findings)}")
          for item in findings:
              name = item.get("RuleID", "unknown")
              file = item.get("File", "unknown")
              commit = str(item.get("Commit", ""))[:12]
              line = item.get("StartLine", "?")
              print(f"rule={name} file={file} commit={commit} line={line}")
          if findings:
              raise SystemExit("Secret scan blocked: review without exposing values")
          PY
